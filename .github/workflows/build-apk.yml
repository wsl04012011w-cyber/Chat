name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "expo-env.d.ts"
      - "lib/**"
      - "assets/**"
      - "supabase/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build preview APK with Expo EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Install dependencies
        run: npm install

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript check
        run: npm run typecheck

      - name: Check EAS configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest config --platform android --profile preview

      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN in GitHub Actions secrets. Create a token in your Expo account settings."
            exit 1
          fi
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait

      - name: Download generated APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p artifacts
          npx eas-cli@latest build:download --platform android --latest --path artifacts/chat-preview.apk

      - name: Upload APK as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-android-apk
          path: artifacts/chat-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Show EAS build link
        if: always()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            npx eas-cli@latest build:list --platform android --limit 1 --json --non-interactive || true
          fi
